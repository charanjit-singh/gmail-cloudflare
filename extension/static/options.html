<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send as alias settings</title>
<style>
  body { font:15px/1.5 system-ui,sans-serif; max-width:560px; margin:32px auto; padding:0 16px; color:#202124 }
  label { display:block; margin:16px 0 4px; font-weight:600 }
  input, textarea { width:100%; padding:8px 10px; border:1px solid #dadce0; border-radius:8px; font:inherit; box-sizing:border-box }
  .hint { color:#5f6368; font-size:13px; margin-top:4px }
  button { margin:16px 8px 0 0; padding:8px 16px; border:0; border-radius:18px; background:#1a73e8; color:#fff; font:inherit; cursor:pointer }
  button.quiet { background:#e8f0fe; color:#1a73e8 }
  #status { margin-top:16px; min-height:1.5em }
</style>
</head>
<body>
<h1>Send as alias</h1>
<label for="workerUrl">Worker URL</label>
<input id="workerUrl" placeholder="https://gmail-cloudflare.you.workers.dev">
<label for="password">Admin password</label>
<input id="password" type="password" autocomplete="off">
<label for="addresses">From addresses, one per line</label>
<textarea id="addresses" rows="5" placeholder="BN Habitat · hello@bnhabitat.com"></textarea>
<div class="hint">Format: Name · address@yourdomain.com. Addresses must be on a domain in your Cloudflare account.</div>
<label for="appId">InboxSDK app ID (optional)</label>
<input id="appId" placeholder="Register a free ID at register.inboxsdk.com">
<button id="save">Save</button><button id="test" class="quiet">Test connection</button>
<div id="status"></div>
<script src="options.js"></script>
</body>
</html>
